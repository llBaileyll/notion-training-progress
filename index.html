<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Training Progress</title>
  <style>
    :root{--bg:#fff;--text:#37352f;--muted:#787774;--line:#e9e9e7;--soft:#f7f7f5;--green:#0f7b6c;--greenSoft:#edf7f4;--greenLine:#b7ddd3;--radius:12px}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    body{padding:2px}.card{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:14px 16px;transition:.18s ease}.card.completed{background:var(--greenSoft);border-color:var(--greenLine)}.library{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:14px;font-weight:650;line-height:1.35}.sub{font-size:12px;color:var(--muted);margin-top:4px}.completed .title{color:var(--green)}.btn{appearance:none;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--text);font:inherit;font-size:13px;font-weight:600;padding:9px 12px;cursor:pointer;white-space:nowrap;transition:.15s ease}.btn:hover{filter:brightness(.98)}.btn.done{background:#fff;border-color:var(--greenLine);color:var(--green)}.check{font-weight:800;margin-right:5px}.progressHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.progressMeta{font-size:12px;color:var(--muted);white-space:nowrap}.track{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .25s ease}.error{font-size:12px;color:#b42318;padding:10px}.compact .card{padding:11px 13px}.compact .title{font-size:13px}@media (prefers-color-scheme:dark){:root{--bg:#191919;--text:#e7e5e4;--muted:#9b9a97;--line:#333;--soft:#242424;--green:#4ec9b0;--greenSoft:#173a35;--greenLine:#2b685d}.btn.done{background:#1f2f2c}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const configScript=document.createElement('script');
configScript.src='progress-config.js?v='+Date.now();
configScript.onload=init;
configScript.onerror=()=>{document.getElementById('app').innerHTML='<div class="error">Could not load training configuration.</div>'};
document.head.appendChild(configScript);
function init(){
const NS='mindly-training-progress:v1';
const cfg=window.TRAINING_CONFIG||{sections:{},lessonNames:{}};
const sections=cfg.sections||{},lessonNames=cfg.lessonNames||{};
const app=document.getElementById('app');
function key(id){return `${NS}:lesson:${id}`}
function isDone(id){return localStorage.getItem(key(id))==='1'}
function setDone(id,v){v?localStorage.setItem(key(id),'1'):localStorage.removeItem(key(id));window.dispatchEvent(new CustomEvent('mindly-progress-change'))}
function stats(s){const complete=(s.lessons||[]).filter(isDone).length,total=(s.lessons||[]).length,pct=total?Math.round(complete/total*100):0;return{complete,total,pct}}
function lessonCard(id){const done=isDone(id);app.innerHTML=`<div class="card ${done?'completed':''}"><div class="row"><div><div class="title">${done?'✓ Lesson completed':'Finished this lesson?'}</div><div class="sub">${done?'Your progress is saved on this browser.':'Mark it complete to save your progress on this browser.'}</div></div><button class="btn ${done?'done':''}" id="toggle">${done?'<span class="check">✓</span> Completed':'Mark as complete'}</button></div></div>`;document.getElementById('toggle').onclick=()=>{setDone(id,!isDone(id));lessonCard(id)}}
function sectionCard(id){const s=sections[id];if(!s){app.innerHTML='<div class="error">Unknown section.</div>';return}const x=stats(s);app.innerHTML=`<div class="card"><div class="progressHead"><div class="title">${s.name}</div><div class="progressMeta">${x.complete} / ${x.total} completed · ${x.pct}%</div></div><div class="track"><div class="fill" style="width:${x.pct}%"></div></div></div>`}
function overallCard(){const all=[...new Set(Object.values(sections).flatMap(s=>s.lessons||[]))],complete=all.filter(isDone).length,total=all.length,pct=total?Math.round(complete/total*100):0;app.innerHTML=`<div class="card"><div class="progressHead"><div><div class="title">Your training progress</div><div class="sub">Progress is saved on this browser and device.</div></div><div class="progressMeta">${complete} / ${total} completed · ${pct}%</div></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}
function libraryCard(){app.innerHTML='<div class="library">'+Object.values(sections).map(s=>{const x=stats(s);return `<div class="card"><div class="progressHead"><div class="title">${s.name}</div><div class="progressMeta">${x.complete} / ${x.total} · ${x.pct}%</div></div><div class="track"><div class="fill" style="width:${x.pct}%"></div></div></div>`}).join('')+'</div>'}
const q=new URLSearchParams(location.search),type=q.get('type')||'lesson',id=(q.get('id')||'').replace(/-/g,'');if(q.get('compact')==='1')document.body.classList.add('compact');function render(){if(type==='lesson'&&id)lessonCard(id);else if(type==='section'&&id)sectionCard(id);else if(type==='overall')overallCard();else if(type==='library')libraryCard();else app.innerHTML='<div class="error">Widget configuration missing.</div>'}render();window.addEventListener('storage',render);window.addEventListener('mindly-progress-change',render);if(type!=='lesson')setInterval(render,1000);
}
</script>
</body>
</html>
