<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Training Progress</title>
  <style>
    :root{--bg:#fff;--text:#37352f;--muted:#787774;--line:#e9e9e7;--soft:#f7f7f5;--green:#0f7b6c;--greenSoft:#edf7f4;--radius:12px}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    body{padding:2px}.card{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:14px 16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:14px;font-weight:650;line-height:1.35}.sub{font-size:12px;color:var(--muted);margin-top:4px}.btn{appearance:none;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--text);font:inherit;font-size:13px;font-weight:600;padding:9px 12px;cursor:pointer;white-space:nowrap;transition:.15s ease}.btn:hover{filter:brightness(.98)}.btn.done{background:var(--greenSoft);border-color:#cde9e2;color:var(--green)}.check{font-weight:800;margin-right:5px}.progressHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.progressMeta{font-size:12px;color:var(--muted);white-space:nowrap}.track{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .25s ease}.error{font-size:12px;color:#b42318;padding:10px}.compact .card{padding:11px 13px}.compact .title{font-size:13px}@media (prefers-color-scheme:dark){:root{--bg:#191919;--text:#e7e5e4;--muted:#9b9a97;--line:#333;--soft:#242424;--green:#4ec9b0;--greenSoft:#173a35}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const NS='mindly-training-progress:v1';
const sections={
  '3c57e6952ac08188a12ded05daafd9b0':{name:'Start Here',lessons:['3c57e6952ac08164a27ede49dbd77af6','3c57e6952ac081839cceda527ad93a88','3c67e6952ac0815a9905ebe917b8a3d9']},
  '3c67e6952ac081338895c5bc6c828936':{name:'CRM Training',lessons:['3c67e6952ac081da9c68f79ddf687ae7','3c67e6952ac081ecbc6fd3e113775d77','3c67e6952ac081048cabd33ba24d2add','3c67e6952ac081a598ead6bb42622600','3c67e6952ac08172bfead721a0f7094a','3c67e6952ac081c4b055d0887371942e']},
  '3c57e6952ac081909087eab40414ed22':{name:'Lead Management',lessons:['3c57e6952ac08150ae0fe395851c6661','3c57e6952ac081ad9ea7f53584727f03','3c67e6952ac0819a97d1e697204d87c3','3c67e6952ac08195a897d8e060c46dab','3c67e6952ac081c5ad36d7600665df81']},
  '3c67e6952ac08123ba30e1a4f4f67447':{name:'Mobile Training',lessons:['3c67e6952ac0810c9cb0fa0ca0da88ff','3c67e6952ac0815384b3f94bd48b66f9','3c67e6952ac0810dbd7ad5a9a05ac2ec','3c67e6952ac081c19ae9cf05b3309f20','3c67e6952ac081658a1ec32e6292c998']},
  '3c67e6952ac08164b0dcf7f15c51d5b6':{name:'Help Center & Support',lessons:['3c67e6952ac08119bd7bc0be8528a9b8','3c67e6952ac081bfa1cdda8deb8d92b5','3c67e6952ac0815e9ae9ea2388b04796','3c67e6952ac081a7bf7ddbf835934642']}
};
const lessonNames={
'3c57e6952ac08164a27ede49dbd77af6':'Welcome to Your CRM','3c57e6952ac081839cceda527ad93a88':'How Your Lead System Works','3c67e6952ac0815a9905ebe917b8a3d9':'Your Daily Workflow','3c67e6952ac081da9c68f79ddf687ae7':'CRM Overview','3c67e6952ac081ecbc6fd3e113775d77':'Contacts','3c67e6952ac081048cabd33ba24d2add':'Opportunities/Pipeline','3c67e6952ac081a598ead6bb42622600':'Conversations','3c67e6952ac08172bfead721a0f7094a':'Calendar/Appointments','3c67e6952ac081c4b055d0887371942e':'Adding Users','3c57e6952ac08150ae0fe395851c6661':'How Leads Work','3c57e6952ac081ad9ea7f53584727f03':'Calling Leads','3c67e6952ac0819a97d1e697204d87c3':'Logging Call Outcomes','3c67e6952ac08195a897d8e060c46dab':'Following Up','3c67e6952ac081c5ad36d7600665df81':'Booking Appointments','3c67e6952ac0810c9cb0fa0ca0da88ff':'Mobile App Setup','3c67e6952ac0815384b3f94bd48b66f9':'Mobile Notifications','3c67e6952ac0810dbd7ad5a9a05ac2ec':'Calling From Mobile','3c67e6952ac081c19ae9cf05b3309f20':'Messaging From Mobile','3c67e6952ac081658a1ec32e6292c998':'Calendar From Mobile','3c67e6952ac08119bd7bc0be8528a9b8':'Best Practices','3c67e6952ac081bfa1cdda8deb8d92b5':'Common Mistakes','3c67e6952ac0815e9ae9ea2388b04796':'Frequently Asked Questions','3c67e6952ac081a7bf7ddbf835934642':'Getting Support'};
function key(id){return `${NS}:lesson:${id}`}
function isDone(id){return localStorage.getItem(key(id))==='1'}
function setDone(id,v){v?localStorage.setItem(key(id),'1'):localStorage.removeItem(key(id)); window.dispatchEvent(new CustomEvent('mindly-progress-change'))}
function lessonCard(id){
  const name=lessonNames[id]||'Lesson'; const done=isDone(id);
  app.innerHTML=`<div class="card"><div class="row"><div><div class="title">${done?'Lesson completed':'Finished this lesson?'}</div><div class="sub">${done?'Your progress is saved on this browser.':'Mark it complete to save your progress on this browser.'}</div></div><button class="btn ${done?'done':''}" id="toggle">${done?'<span class="check">✓</span> Completed':'Mark as complete'}</button></div></div>`;
  toggle.onclick=()=>{setDone(id,!isDone(id));lessonCard(id)};
}
function sectionCard(id){
  const s=sections[id]; if(!s){app.innerHTML='<div class="error">Unknown section.</div>';return}
  const complete=s.lessons.filter(isDone).length,total=s.lessons.length,pct=total?Math.round(complete/total*100):0;
  app.innerHTML=`<div class="card"><div class="progressHead"><div class="title">${s.name}</div><div class="progressMeta">${complete} / ${total} completed · ${pct}%</div></div><div class="track" aria-label="${pct}% complete"><div class="fill" style="width:${pct}%"></div></div></div>`;
}
function overallCard(){
  const all=[...new Set(Object.values(sections).flatMap(s=>s.lessons))],complete=all.filter(isDone).length,total=all.length,pct=Math.round(complete/total*100);
  app.innerHTML=`<div class="card"><div class="progressHead"><div><div class="title">Your training progress</div><div class="sub">Progress is saved on this browser and device.</div></div><div class="progressMeta">${complete} / ${total} completed · ${pct}%</div></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
}
const q=new URLSearchParams(location.search),type=q.get('type')||'lesson',id=(q.get('id')||'').replace(/-/g,'');
if(q.get('compact')==='1')document.body.classList.add('compact');
if(type==='lesson'&&id)lessonCard(id); else if(type==='section'&&id)sectionCard(id); else if(type==='overall')overallCard(); else app.innerHTML='<div class="error">Widget configuration missing.</div>';
window.addEventListener('storage',()=>{if(type==='lesson')lessonCard(id);else if(type==='section')sectionCard(id);else overallCard()});
window.addEventListener('mindly-progress-change',()=>{if(type==='section')sectionCard(id);else if(type==='overall')overallCard()});
</script>
</body>
</html>
