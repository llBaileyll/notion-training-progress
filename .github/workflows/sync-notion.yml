name: Sync Notion Training

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/sync-notion.yml'
      - 'scripts/sync_notion.py'
      - 'index.html'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync lessons and widgets from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Commit generated config if changed
        run: |
          if git diff --quiet -- progress-config.js; then
            echo "No config changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress-config.js
          git commit -m "Sync training progress config from Notion"
          git push
